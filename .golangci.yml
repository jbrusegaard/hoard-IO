# .golangci.yml - AI-verified lint configuration for hoardio
# Schema: golangci-lint v2 (installed: v2.13)
version: "2"

run:
  timeout: 5m # v2 defaults to readonly module downloads

linters:
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck # no SQL in this project; kept for completeness, won't trigger
    - sqlclosecheck # ditto
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5 # v4 (wsl) is deprecated in golangci-lint v2; v5 needs explicit settings

  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    funlen:
      lines: 80
      statements: 50
    gocyclo:
      min-complexity: 10
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    nestif:
      min-complexity: 5
    gosec:
      excludes:
        - G104 # unhandled errors; errcheck covers this better
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: "Deprecated: use io and os packages instead"
            - pkg: github.com/pkg/errors
              desc: "Use fmt.Errorf with %w instead"
    revive:
      # Mirrors revive.toml (used by the standalone `revive` CLI).
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: modifies-value-receiver
        - name: waitgroup-by-value
        - name: atomic
        - name: range-val-in-closure
        - name: range-val-address
        - name: constant-logical-expr
        - name: identical-branches
        - name: unconditional-recursion
        - name: duplicated-imports
        - name: unhandled-error
          arguments: ["fmt.Printf", "fmt.Println", "fmt.Print"]
        - name: max-public-structs
          arguments: [5]
        - name: cyclomatic
          arguments: [10]
        - name: cognitive-complexity
          arguments: [15]
        - name: argument-limit
          arguments: [5]
        - name: function-result-limit
          arguments: [3]

  exclusions:
    generated: lax
    rules:
      # Test files get a pass on function-length and duplication rules.
      - path: _test\.go
        linters:
          - funlen
          - dupl
      # Benchmark fixtures legitimately write temp files with convenience
      # perms and unchecked cleanup; the product code stays strictly read-only.
      # Style/complexity rules target product code only (developer-approved).
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - wrapcheck
          - wsl_v5
          - gocyclo
          # Fixture builders in *_bench_test.go are scaffolding; the product
          # code holds the full complexity ruleset.
          - revive

formatters:
  enable:
    - gofmt
    - goimports
